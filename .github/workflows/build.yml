name: Build FitCalc

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-15-intel
            build: --mac dmg zip --publish never
          - os: windows-latest
            build: --win nsis --publish never
          - os: ubuntu-latest
            build: --linux AppImage --publish never

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build FitCalc
        run: npx electron-builder ${{ matrix.build }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: FitCalc-${{ matrix.os }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FitCalc ${{ github.ref_name }}
          generate_release_notes: true
          files: release-files/*
