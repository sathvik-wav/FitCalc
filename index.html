<!DOCTYPE html>
<html lang="en">
   <head>
        <meta charset="UTF-8">
        <meta name="viewport" 
        content="width=device-width, initial-scale=1.0">
        <title>FitCalc - Fitness Buddy</title>
        <link rel="stylesheet" href="main.css">
    </head>
    <body>
        <div class="container">
        <div class="form">
            <h1>FitCalc</h1>
            <p class="tagline">Your Fitness Buddy</p>
            <input type="number" placeholder="Age" id="age"> 
            <input type="number" placeholder="Weight (kg)" id="weight">
            <input type="number" placeholder="Height (cm)" id="height">
            <select id="gender">
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <select id="activity">
                <option value="">Activity Level</option>
                <option value="1.2">Sedentary</option>
                <option value="1.375">Lightly Active</option>
                <option value="1.55">Moderate</option>
                <option value="1.725">Very Active</option>
            </select>
            <select id="goal">
                <option value="">Goal</option>
                <option value="maintain">Maintain</option>
                <option value="cut">Cut</option>
                <option value="bulk">Bulk</option>
            </select>
            <button type="button">Submit</button>
        </div>
        </div>
        <div id="result"></div>
        <div id="planResult"></div>
        <footer>
            <p class="built">Built by WavForge</p>
            <p class="copyright">© 2026 FitCalc</p>
            <div class="socials">
                <a href="https://www.youtube.com/@redriffx" target="_blank"><img src="assets/youtube.svg" class="icon"></a>
                <a href="https://www.instagram.com/sathvik.0" target="_blank"><img src="assets/instagram.svg" class="icon"></a>
                <a href="https://github.com/sathvik-wav" target="_blank"><img src="assets/github.svg" class="icon"></a>
            </div>
        </footer>
       <script src="script.js"></script>
    </body>
</html>
